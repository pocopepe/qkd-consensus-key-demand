<svg viewBox="0 0 760 420" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Buying the optimiser more search time" class="viz">
<style>.viz{--surface-1:#fcfcfb;--text-primary:#0b0b0b;--text-secondary:#52514e;--muted:#8a8a86;--grid:#e4e4e1;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#4a3aa7;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .viz{--surface-1:#1a1a19;--text-primary:#f5f5f2;--text-secondary:#c3c2b7;--muted:#8e8e88;--grid:#2e2e2c;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#9085e9;}}:root[data-theme="dark"] .viz{--surface-1:#1a1a19;--text-primary:#f5f5f2;--text-secondary:#c3c2b7;--muted:#8e8e88;--grid:#2e2e2c;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#9085e9;}.viz .ttl{fill:var(--text-primary);font-size:15px;font-weight:600}.viz .sub{fill:var(--text-secondary);font-size:12px}.viz .ax{fill:var(--text-secondary);font-size:11px;font-variant-numeric:tabular-nums}.viz .axname{fill:var(--muted);font-size:11px;letter-spacing:.04em}.viz .gl{stroke:var(--grid);stroke-width:1}.viz .dl{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}.viz .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.viz .mk{stroke:var(--surface-1);stroke-width:2}</style>
<rect x="0" y="0" width="760" height="420" fill="var(--surface-1)"/>
<text class="ttl" x="64" y="24">Buying the optimiser more search time</text>
<text class="sub" x="64" y="42">Lower is better. The hybrid saturates at 4.5 ms; the fixed rule reaches 0.014 ms for less compute.</text>
<line class="gl" x1="64" y1="364.0" x2="628" y2="364.0"/>
<text class="ax" x="55" y="368.0" text-anchor="end">0.0</text>
<line class="gl" x1="64" y1="266.0" x2="628" y2="266.0"/>
<text class="ax" x="55" y="270.0" text-anchor="end">2.0</text>
<line class="gl" x1="64" y1="168.0" x2="628" y2="168.0"/>
<text class="ax" x="55" y="172.0" text-anchor="end">4.0</text>
<line class="gl" x1="64" y1="70.0" x2="628" y2="70.0"/>
<text class="ax" x="55" y="74.0" text-anchor="end">6.0</text>
<text class="ax" x="64.0" y="383.0" text-anchor="middle">2</text>
<text class="ax" x="87.5" y="383.0" text-anchor="middle">4</text>
<text class="ax" x="158.0" y="383.0" text-anchor="middle">10</text>
<text class="ax" x="334.2" y="383.0" text-anchor="middle">25</text>
<text class="ax" x="628.0" y="383.0" text-anchor="middle">50</text>
<text class="axname" x="346" y="410" text-anchor="middle">search budget per view (ms)</text>
<text class="axname" transform="translate(16,217) rotate(-90)" text-anchor="middle">p50 round latency (ms)</text>
<path class="ln" d="M64.0,70.0 L87.5,143.5 L158.0,143.5 L334.2,143.5 L628.0,143.5" stroke="var(--s1)"/>
<circle class="mk" cx="64.0" cy="70.0" r="4.5" fill="var(--s1)"><title>hybrid: 2, 6.0</title></circle>
<circle class="mk" cx="87.5" cy="143.5" r="4.5" fill="var(--s1)"><title>hybrid: 4, 4.5</title></circle>
<circle class="mk" cx="158.0" cy="143.5" r="4.5" fill="var(--s1)"><title>hybrid: 10, 4.5</title></circle>
<circle class="mk" cx="334.2" cy="143.5" r="4.5" fill="var(--s1)"><title>hybrid: 25, 4.5</title></circle>
<circle class="mk" cx="628.0" cy="143.5" r="4.5" fill="var(--s1)"><title>hybrid: 50, 4.5</title></circle>
<text class="dl" x="638.0" y="147.5" fill="var(--s1)">hybrid</text>
<path class="ln" d="M64.0,363.3 L628.0,363.3" stroke="var(--s2)" stroke-dasharray="6 4"/>
<circle class="mk" cx="64.0" cy="363.3" r="4.5" fill="var(--s2)"><title>quorum rule: 2, 0.0</title></circle>
<circle class="mk" cx="628.0" cy="363.3" r="4.5" fill="var(--s2)"><title>quorum rule: 50, 0.0</title></circle>
<text class="dl" x="638.0" y="367.3" fill="var(--s2)">quorum rule</text>
<path class="ln" d="M64.0,70.0 L628.0,70.0" stroke="var(--s3)" stroke-dasharray="6 4"/>
<circle class="mk" cx="64.0" cy="70.0" r="4.5" fill="var(--s3)"><title>greedy rule: 2, 6.0</title></circle>
<circle class="mk" cx="628.0" cy="70.0" r="4.5" fill="var(--s3)"><title>greedy rule: 50, 6.0</title></circle>
<text class="dl" x="638.0" y="74.0" fill="var(--s3)">greedy rule</text>
</svg>