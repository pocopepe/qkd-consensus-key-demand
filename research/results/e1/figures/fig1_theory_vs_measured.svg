<path class="ln" d="M64.0,364.0 L628.0,70.0" stroke="var(--s1)" stroke-dasharray="6 4"/>
<circle class="mk" cx="64.0" cy="364.0" r="4.5" fill="var(--s1)"><title>y = x: 0.00, 0.00</title></circle>
<circle class="mk" cx="628.0" cy="70.0" r="4.5" fill="var(--s1)"><title>y = x: 1.00, 1.00</title></circle>
<text class="dl" x="638.0" y="74.0" fill="var(--s1)">y = x</text>
<path class="ln" d="M628.0,70.0 L628.0,70.4 L628.0,70.0" stroke="var(--s2)"/>
